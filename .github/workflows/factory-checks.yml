name: Factory standards and manifest checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # a newer push to the same PR cancels the older run; pushes to main and tags always finish
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '^22.13.0'  # node:sqlite for the telemetry relay's D1 shim needs 22.13+
      - name: Compile factory CLI
        run: python -m py_compile scripts/factory.py
      - name: Check catalog and schema
        run: python scripts/factory.py doctor
      - name: Validate examples (specification only)
        run: |
          python scripts/factory.py check examples/hessa-product.json
          python scripts/factory.py check examples/trip-orders-product.json
          python scripts/factory.py check examples/multi-branch-reference.json
          python scripts/factory.py check examples/vendor-control-center.json
          python scripts/factory.py check examples/al-store-product.json
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Control Center tests
        working-directory: apps/control-center
        env:
          PYTHONPATH: ../../packages/af-license
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Licence package tests (af-license)
        working-directory: packages/af-license
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Access gate tests (af-access)
        working-directory: packages/af-access
        run: python -m unittest discover -s tests -v
      - name: Guide engine tests (af-guide; browser tests run in the guide-browser job)
        working-directory: packages/af-guide
        run: |
          python -m unittest discover -s tests -v
          node --check af-guide.js
          node --check demo/demo.js
          node --test tests/core.test.mjs
          python af_guide.py check examples/shop --ui examples/shop/ui-ar.json --ui examples/shop/ui-en.json --access examples/shop/access.json --errors examples/shop/errors.json --release
      - name: Consent and telemetry tests (af-consent, af-telemetry)
        run: |
          python -m unittest discover -s packages/af-consent/tests -v
          python -m unittest discover -s packages/af-telemetry/tests -v
          node --check packages/af-consent/af-consent.js
          node --test packages/af-consent/tests/core.test.mjs
          node --check packages/af-telemetry/af-telemetry.js
          node --test packages/af-telemetry/tests/core.test.mjs
      - name: Telemetry relay tests (Cloudflare Worker + D1 shim)
        run: node --experimental-sqlite --test templates/telemetry-relay/test/relay.test.mjs templates/telemetry-relay/test/licence.test.mjs templates/telemetry-relay/test/telegram.test.mjs
      - name: Check out Al-Store beside the factory (the chain test needs its real licence verifier)
        uses: actions/checkout@v7
        with:
          repository: coolman1984/Store
          path: store-checkout
      - name: Licence Studio tests (including the chain test, a Studio code unlocks the real Al-Store and another PC refuses it)
        working-directory: apps/licence-studio
        env:
          PYTHONPATH: ../../packages/af-license
          AF_STORE_REPO: ${{ github.workspace }}/store-checkout
          AF_REQUIRE_STORE: '1'
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: UI budgets are valid JSON
        run: python -m json.tool factory/ui-budgets.json > /dev/null
      - name: Assert release remains blocked until evidence exists
        run: |
          for f in examples/hessa-product.json examples/multi-branch-reference.json examples/vendor-control-center.json examples/al-store-product.json; do
            if python scripts/factory.py check "$f" --release; then
              echo "ERROR: $f improperly passed commercial release gate" >&2
              exit 1
            fi
          done


  windows-contract:
    # Baseline standards must run under Windows as well as Linux.
    # Windows Python console encoding is not UTF-8 unless explicitly enabled.
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    # Product repositories must separately build and install their own binaries.
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Windows factory manifest and catalogue
        shell: pwsh
        run: |
          python scripts/factory.py doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/factory.py check examples/al-store-product.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows factory standard regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  guide-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright for QA only
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: af-guide in a real browser (walk every course, resume, language switch, CSP)
        working-directory: packages/af-guide
        run: python -m unittest tests.test_browser -v
