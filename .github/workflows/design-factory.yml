name: Design Factory visual and component checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # a newer push to the same PR cancels the older run; pushes to main and tags always finish
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Design Factory standards and pinned upstream gitlinks
        run: python -m unittest discover -s design-factory/tests -v
      - name: Check source scripts syntax
        run: |
          node --check design-factory/reference/app.js
          node --check design-factory/qa/capture.mjs
          node --check design-factory/creative-lab/creative.js
          node --check design-factory/creative-lab/qa/test.mjs
          node --check design-factory/core/creative-primitives.js
          node --check design-factory/core/af-icons.js
          node --check design-factory/icon-studio/studio.js
          node --check design-factory/icon-studio/qa/test.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '^22.13.0'  # the factory's Node baseline (22.13+)
      - name: Install exact Playwright version for QA only
        working-directory: design-factory
        run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        working-directory: design-factory
        run: npx playwright install --with-deps chromium
      - name: Test live offline reference across viewports, directions and themes
        working-directory: design-factory
        run: |
          npm run test:browser
          npm run test:creative
          npm run test:icons
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: design-factory-screenshots
          path: design-factory/artifacts/
          if-no-files-found: warn
          retention-days: 14
