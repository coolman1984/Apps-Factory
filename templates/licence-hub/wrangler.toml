name = "my-licence-hub"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "my-licence"
database_id = "REPLACE-WITH-D1-ID"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"  # default auto-trailing-slash loops /owner/login.html <-> /owner/login

[triggers]
crons = ["0 4 * * *"]

[vars]
# Comma-separated product ids (examples: trip-orders, al-store)
LICENCE_PRODUCTS = "my-product"
# Optional: omitted `product` on licence requests (defaults to first LICENCE_PRODUCTS entry)
# LICENCE_DEFAULT_PRODUCT = "trip-orders"
# Optional Arabic labels for owner UI: {"my-product":"اسم المنتج","trip-orders":"طلبات الرحلات"}
# LICENCE_PRODUCT_LABELS = "{}"
TRIAL_DAYS = "14"
SESSION_HOURS = "8"
LICENCE_CALENDAR_TZ = "Africa/Cairo"

# Secrets (never in git):
#   npx wrangler secret put LICENCE_SIGNING_KEY   # PKCS#8 PEM Ed25519 trial-hub private key only
#   npx wrangler secret put PAID_SIGNING_KEY      # PKCS#8 PEM Ed25519 paid kid "paid" (monthly/permanent hub codes)
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put OWNER_PASSWORD_HASH   # pbkdf2-sha256:iterations:salt_hex:hash_hex
# Optional Telegram on new request:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
